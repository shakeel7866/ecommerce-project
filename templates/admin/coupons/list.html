{% extends "base.html" %}

{% block title %}
Coupons
{% endblock %}

{% block content %}

<div class="container mt-5">

<div class="d-flex justify-content-between mb-4">

<h2>Coupon Management</h2>

<a href="/admin/coupons/add"
class="btn btn-primary">

Add Coupon

</a>

</div>

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>ID</th>

<th>Coupon</th>

<th>Discount</th>

<th>Minimum</th>

<th>Expiry</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody>

{% for c in coupons %}

<tr>

<td>{{ c[0] }}</td>

<td>{{ c[1] }}</td>

<td>{{ c[2] }}%</td>

<td>Rs {{ c[3] }}</td>

<td>{{ c[4] }}</td>

<td>{{ c[5] }}</td>

<td>

<a href="/admin/coupons/edit/{{ c[0] }}"
class="btn btn-warning btn-sm">

Edit

</a>

<a href="/admin/coupons/delete/{{ c[0] }}"
class="btn btn-danger btn-sm">

Delete

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

{% endblock %}
